upstream backend_servers {
    # Балансировка round-robin с отказоустойчивостью
    server backend1:3000 max_fails=2 fail_timeout=30s;
    server backend2:3000 max_fails=2 fail_timeout=30s;
    server backend3:3000 backup;  # резервный сервер
}

upstream websocket_servers {
    server backend1:3000;
    server backend2:3000;
}

server {
    listen 80;
    server_name localhost;

    # Основной прокси для API
    location /api/ {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket поддержка
    location /socket.io/ {
        proxy_pass http://websocket_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Статика фронтенда
    location / {
        proxy_pass http://frontend:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check для мониторинга
    location /health {
        proxy_pass http://backend_servers/health;
        access_log off;
    }
}